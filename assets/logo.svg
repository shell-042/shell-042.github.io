<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" role="img" aria-label="shell 花体 L 标识">
  <defs>
    <linearGradient id="lg" x1="0.18" y1="0.02" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#1A47E6"/>
      <stop offset="0.55" stop-color="#7A3FE6"/>
      <stop offset="1" stop-color="#F2602E"/>
    </linearGradient>
  </defs>

  <!-- 主体一笔：顶部椭圆环 + 倾斜竖笔 + 右弧线尾巴 + 末端小圈 -->
  <path d="
    M 28 16
    C 18 6 4 14 8 26
    C 12 38 28 42 30 30
    L 28 54
    C 28 64 40 66 52 62
    C 62 58 64 48 56 48
  "
  stroke="url(#lg)"
  stroke-width="3.6"
  stroke-linecap="round"
  stroke-linejoin="round"/>

  <!-- 破锋：竖笔底部分出的左后弯短支 -->
  <path d="M 28 54 C 22 58 14 56 10 48"
        stroke="url(#lg)"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.78"/>

  <!-- 珊瑚色节点：收笔强调 -->
  <circle cx="56" cy="48" r="1.8" fill="#F2602E"/>
</svg>
